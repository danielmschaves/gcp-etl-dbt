version: 2

# test all models dim_date, dim_product, dim_store, fact_sales

models:
  - name: dim_users
    description: "User dimension table"
    columns:
      - name: user_id
        description: "Unique user identifier"
        tests:
          - unique
          - relationships:
              to: dim_orders.user_id
      - name: fist_name
        description: "User name"
        tests:
          - not_null
      - name: last_name
        description: "User name"
        tests:
          - not_null
      - name: email
        description: "User email"
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension table"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - unique
      - name: name 
        description: "Product name"
        tests:
          - not_null
      - name: category
        description: "Product category"
        tests:
          - not_null
      - name: brand
        description: "Product brand"
        tests:
          - not_null
      - name: department
        description: "Product department"
        tests:
          - not_null
      - name: sku
        description: "Product sku"
        tests:
          - not_null
      - name: retail_price
        description: "Product retail price"
        tests:
          - not_null

  - name: dim_orders
    description: "Order dimension table"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
      - name: user_id
        description: "User identifier"
        tests:
          - not_null
      - name: status
        description: "Order status"
        tests:
          - not_null
      - name: created_at
        description: "Order creation date"
        tests:
          - not_null
      - name: shipped_at
        description: "Order shipping date"
        tests:
          - not_null
      - name: delivered_at
        description: "Order delivery date"
        tests:
          - not_null
      - name: returned_at
        description: "Order return date"
        tests:
          - not_null

  - name: dim_date
    description: "Date dimension table"
    columns:
      - name: date_key
        description: "Unique date identifier"
        tests:
          - unique
      - name: date
        description: "Date"
        tests:
          - not_null
      - name: day
        description: "Day"
        tests:
          - not_null
      - name: month
        description: "Month"
        tests:
          - not_null
      - name: quarter
        description: "Quarter"
        tests:
          - not_null
      - name: year
        description: "Year"
        tests:
          - not_null
      - name: day_of_week
        description: "Day of week"
        tests:
          - not_null

  - name: fact_order_items
    description: "Order items fact table"
    columns:
      - name: order_item_id
        description: "Unique order item identifier"
        tests:
          - unique
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: product_id
        description: "Product identifier"
        tests:
          - not_null
      - name: user_id
        description: "User identifier"
        tests:
          - not_null
      - name: created_at
        description: "Order item creation timestamp (used as incremental watermark)"
        tests:
          - not_null
      - name: order_date_key
        description: "Order date key"
        tests:
          - not_null
      - name: shipped_date_key
        description: "Shipped date key"
        tests:
          - not_null
      - name: delivered_date_key
        description: "Delivered date key"
        tests:
          - not_null
      - name: returned_date_key
        description: "Returned date key"
        tests:
          - not_null
      - name: sale_price
        description: "Order item sale price"
        tests:
          - not_null
      - name: num_of_item
        description: "Number of items in the order"
        tests:
          - not_null
      - name: cost
        description: "Order item cost"
        tests:
          - not_null
      - name: profit
        description: "Sale price minus cost"
        tests:
          - not_null
      - name: margin
        description: "Profit divided by sale price"

  - name: mart_sales_by_state
    description: "Total sales and order count by US state"
    columns:
      - name: state
        description: "US state"
      - name: total_sales
        description: "Total revenue for the state"
      - name: order_count
        description: "Number of distinct orders"

  - name: mart_profit_by_category
    description: "Revenue, profit, and margin by product category"
    columns:
      - name: category
        description: "Product category"
      - name: total_revenue
        description: "Total revenue"
      - name: total_profit
        description: "Total gross profit"
      - name: avg_margin_pct
        description: "Average margin percentage"
      - name: items_sold
        description: "Number of items sold"

  - name: mart_brand_performance
    description: "Revenue, profit, and margin by brand and category"
    columns:
      - name: brand
        description: "Product brand"
      - name: category
        description: "Product category"
      - name: total_revenue
        description: "Total revenue"
      - name: total_profit
        description: "Total gross profit"
      - name: avg_margin_pct
        description: "Average margin percentage"
      - name: items_sold
        description: "Number of items sold"

  - name: mart_product_margin
    description: "Top 20 products by profit with margin metrics"
    columns:
      - name: product_name
        description: "Product name"
      - name: category
        description: "Product category"
      - name: brand
        description: "Product brand"
      - name: total_revenue
        description: "Total revenue"
      - name: total_profit
        description: "Total gross profit"
      - name: avg_margin_pct
        description: "Average margin percentage"
      - name: items_sold
        description: "Number of items sold"

  - name: mart_traffic_source_performance
    description: "Revenue, orders, and users by acquisition traffic source"
    columns:
      - name: traffic_source
        description: "Acquisition channel"
      - name: total_revenue
        description: "Total revenue"
      - name: order_count
        description: "Number of distinct orders"
      - name: avg_order_value
        description: "Average order value"
      - name: user_count
        description: "Number of distinct users"

  - name: mart_age_group_revenue
    description: "Revenue and order metrics by customer age group"
    columns:
      - name: age_group
        description: "Age bucket (<25, 25-34, 35-44, 45-54, 55+)"
      - name: user_count
        description: "Number of distinct users"
      - name: total_revenue
        description: "Total revenue"
      - name: avg_order_value
        description: "Average order value"

  - name: mart_return_rate
    description: "Return rate by product category"
    columns:
      - name: category
        description: "Product category"
      - name: total_items
        description: "Total items sold"
      - name: returned_items
        description: "Number of returned items"
      - name: return_rate_pct
        description: "Return rate as a percentage"

  - name: mart_event_funnel
    description: "Event counts, sessions, and users by event type from stg_events"
    columns:
      - name: event_type
        description: "Type of user event"
      - name: event_count
        description: "Total number of events"
      - name: unique_sessions
        description: "Number of distinct sessions"
      - name: unique_users
        description: "Number of distinct users"
