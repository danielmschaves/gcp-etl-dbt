[project]
name = "gcp-etl-dbt"
version = "0.1.0"
description = "E-commerce data pipeline using BigQuery, DuckDB, and dbt"
authors = [{name = "danielmschaves", email = "danielmschaves@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=0.10.2",
    "fire>=0.5.0",
    "google-cloud-bigquery>=3.13.0",
    "loguru>=0.7.2",
    "google-auth>=2.24.0",
    "pydantic>=2.5.2",
    "db-dtypes>=1.1.1",
    "pandas>=2.1.3",
    "pyarrow>=14.0.2",
    "google-cloud-bigquery-storage>=2.24.0",
    "dbt-duckdb[md]==1.8.1",
    "numpy<2.0.0",
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "ruff>=0.5.0",
    "sqlfluff>=3.0.7",
    "harlequin>=1.21.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
